name: Build Sideload IPA

on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Patch expo-modules-jsi for Xcode 26
        run: |
          set -euo pipefail
          FILE="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          test -f "$FILE"
          grep -q SWIFT_RETURNS_RETAINED "$FILE"
          perl -pi -e 's/\bSWIFT_RETURNS_RETAINED //g' "$FILE"
          if grep -n SWIFT_RETURNS_RETAINED "$FILE"; then
            echo "patch did not remove SWIFT_RETURNS_RETAINED" >&2
            exit 1
          fi
          echo "patched $FILE"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Generate AppIcon PNGs
        run: node scripts/make-icons.mjs

      - name: Expo prebuild iOS
        env:
          CI: 1
          EXPO_NO_GIT_STATUS: 1
        run: npx expo prebuild --platform ios --non-interactive

      - name: Ensure AppIcon asset catalog
        run: |
          set -euo pipefail
          SET="$(find ios -type d -name 'AppIcon.appiconset' | head -n 1)"
          echo "AppIcon set: ${SET:-missing}"
          test -n "$SET"
          if ! ls "$SET"/*.png >/dev/null 2>&1; then
            echo "AppIcon catalog had no PNGs — seeding 1024 icon"
            cp assets/images/icon.png "$SET/AppIcon.png"
            printf '%s\n' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$SET/Contents.json"
          fi
          ls -la "$SET"

      - name: CocoaPods
        working-directory: ios
        run: |
          set -euo pipefail
          pod --version
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Disable signing on every target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ios")
          if not root.exists():
              raise SystemExit("ios/ missing after prebuild")
          changed = 0
          for path in root.rglob("*.pbxproj"):
              text = path.read_text(encoding="utf-8")
              next_text = text.replace("CODE_SIGNING_ALLOWED = YES", "CODE_SIGNING_ALLOWED = NO")
              next_text = next_text.replace('CODE_SIGN_STYLE = Automatic', 'CODE_SIGN_STYLE = Manual')
              if next_text != text:
                  path.write_text(next_text, encoding="utf-8")
                  changed += 1
                  print(f"unsigned: {path}")
          print(f"patched {changed} pbxproj files")
          PY

      - name: Build unsigned device app
        env:
          NODE_BINARY: ${{ env.NODE_BINARY }}
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          cd ios
          WORKSPACE="$(ls -d *.xcworkspace 2>/dev/null | head -n 1 || true)"
          PROJECT="$(ls -d *.xcodeproj 2>/dev/null | head -n 1 || true)"
          if [ -n "$WORKSPACE" ]; then
            LIST_ARGS=(-workspace "$WORKSPACE")
            BUILD_ARGS=(-workspace "$WORKSPACE")
          else
            LIST_ARGS=(-project "$PROJECT")
            BUILD_ARGS=(-project "$PROJECT")
          fi
          SCHEME="$(
            xcodebuild "${LIST_ARGS[@]}" -list |
            awk '
              /Schemes:/{f=1;next}
              f && NF {
                gsub(/^[ \t]+/,"",$0)
                if ($0=="LifeEngine" || $0=="Life Engine") { print; found=1; exit }
                if (!first) first=$0
              }
              END { if (!found && first) print first }
            '
          )"
          echo "Using scheme: $SCHEME"
          test -n "$SCHEME"
          xcodebuild \
            "${BUILD_ARGS[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            TARGETED_DEVICE_FAMILY=1,2 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            INFOPLIST_KEY_CFBundleDisplayName="Life Engine" \
            INFOPLIST_KEY_CFBundleIconName=AppIcon

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData" -name '*.app' -path '*/Release-iphoneos/*' | head -n 1)"
          echo "Found app: $APP"
          test -d "$APP"
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "Executable: $EXEC"
          file "$APP/$EXEC"
          file "$APP/$EXEC" | grep -q 'Mach-O'
          test -f "$APP/Assets.car" || ls -la "$APP"/AppIcon* || {
            echo "AppIcon / Assets.car missing from .app" >&2
            ls -la "$APP"
            exit 1
          }
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP" "Payload/LifeEngine.app"
          zip -qry LifeEngine.ipa Payload
          ls -lh LifeEngine.ipa
          BYTES="$(stat -f%z LifeEngine.ipa)"
          echo "IPA bytes: $BYTES"
          if [ "$BYTES" -lt 8000000 ]; then
            echo "IPA is too small to be a real device binary ($BYTES bytes)" >&2
            exit 1
          fi
          unzip -l LifeEngine.ipa | head -n 40

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeEngine-sideload
          path: LifeEngine.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9-ipa
          name: Life Engine v1.0.9 IPA
          body: |
            Unsigned universal IPA (iPhone + iPad) for Sideloadly / AltStore.
            Real arm64 Mach-O from Xcode 26, with AppIcon on the home screen.
            Screen Time: native FamilyActivityPicker, DeviceActivity minutes, ManagedSettings shield.
            Unlock after limit: type the phrase 24 times.
            OS-level blocking needs Apple Family Controls on a paid team; Sideloadly may strip that entitlement.
          files: LifeEngine.ipa
          fail_on_unmatched_files: true
